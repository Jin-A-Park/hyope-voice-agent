<!doctype html>
<!--
  어르신 안부전화 — 텍스트 입력 버전.

    * index.html과 같은 /ws/browser 리얼타임 웹소켓을 쓰는 별도 페이지 — 다만
      마이크 대신 타이핑으로 어르신 발화를 만든다. 입력한 문장은 서버의 /tts로
      보내 실제 음성(mp3)으로 합성한 뒤, PCM16으로 디코드해서 index.html의
      마이크 입력과 똑같은 경로("audio" 메시지)로 흘려보낸다 — 그래야 서버쪽
      VAD/STT를 포함한 진짜 음성 파이프라인의 지연시간을 잴 수 있다.
    * 지연시간은 "오디오 전송 시작" 시점부터 "에이전트의 첫 응답(오디오/자막)이
      온" 시점까지를 재서, 내가 보낸 말풍선 아래 ms로 표시한다.
    * "시작하기"로 웹소켓을 열면 서버가 곧바로 인사말(오디오+자막)을 보낸다.
    * call_ended가 오면 세션을 끝내고 "시작하기"로 되돌아간다(index.html과 동일 개념).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어르신 안부전화 (텍스트)</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --text: #e8eaf0; --dim: #8b90a0;
    --accent: #e4573d; --tts: #4ecf8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: .9rem 1.1rem; border-bottom: 1px solid #262a36; flex-shrink: 0;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  #status { color: var(--dim); font-size: .8rem; margin-top: .15rem; }
  #model {
    background: var(--panel); color: var(--text); border: 1px solid #2a2e3a;
    border-radius: .4rem; padding: .3rem .5rem; font: inherit;
  }
  #reset {
    background: none; border: 1px solid #3a3f4e; color: var(--dim);
    border-radius: 8px; padding: .35rem .8rem; font: 500 .8rem system-ui; cursor: pointer;
  }
  #reset:hover { color: var(--text); border-color: var(--dim); }

  #log {
    flex: 1; overflow-y: auto; padding: 1rem 1rem .5rem;
    display: flex; flex-direction: column; gap: .6rem;
  }

  .msg { display: flex; flex-direction: column; max-width: 75%; }
  .msg.elder { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble { border-radius: 14px; padding: .55rem .85rem; white-space: pre-wrap; }
  .msg.elder .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--panel); border-bottom-left-radius: 4px; }
  .msg .who { font-size: .7rem; color: var(--dim); margin: 0 .3rem .2rem; }
  .msg .err .bubble { background: #3a1f22; color: #ff9a8f; }

  .tools { margin-top: .3rem; }
  .tools span {
    display: inline-block; font: 500 .7rem ui-monospace, monospace;
    background: rgba(78,207,138,.12); color: var(--tts);
    border: 1px solid rgba(78,207,138,.4); border-radius: 999px;
    padding: .1rem .5rem; margin-right: .3rem; margin-top: .2rem;
  }

  .latency { font: 500 .7rem ui-monospace, monospace; color: var(--dim); margin-top: .25rem; }

  #composer {
    flex-shrink: 0; border-top: 1px solid #262a36; padding: .8rem 1rem;
    display: flex; gap: .6rem; align-items: center;
  }
  #start {
    width: 100%; padding: .8rem; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font: 600 .95rem system-ui; cursor: pointer;
  }
  #start:disabled { background: #3a3f4e; cursor: not-allowed; }
  #text {
    flex: 1; padding: .7rem .9rem; border-radius: 10px; border: 1px solid #3a3f4e;
    background: var(--panel); color: var(--text); font: inherit;
  }
  #text:disabled { opacity: .5; }
  #send {
    padding: .7rem 1.1rem; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font: 600 .9rem system-ui; cursor: pointer;
  }
  #send:disabled { background: #3a3f4e; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>어르신 안부전화 (텍스트)</h1>
      <div id="status">Loading…</div>
    </div>
    <select id="model">
      <option value="">xAI (grok-voice-think-fast-1.0, 기본값)</option>
      <option value="gemini-3.1-flash-live-preview">Gemini Live (gemini-3.1-flash-live-preview)</option>
    </select>
    <button id="reset" title="Clear the server's conversation memory">✕ new call</button>
  </header>

  <div id="log"></div>

  <div id="composer">
    <button id="start" disabled>시작하기</button>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const status = (msg) => { $("status").textContent = msg; };

const OUTPUT_SAMPLE_RATE = 24000; // must match server.py's session.input/output_audio_format assumption
const TRAILING_SILENCE_SEC = 1.5; // 합성 음성 끝에 무음을 붙여 서버 VAD가 "말이 끝났다"고 판단하게 함 (0.5s는 VAD가 못 잡아서 응답이 영영 안 옴 — 실측 후 여유 있게 설정)
let ws = null;
let outputCtx = null;
let nextPlayTime = 0;
let currentAgentBubble = null;

// 지연시간 측정: "오디오 전송 시작" -> "에이전트의 첫 응답(오디오/자막)" 사이의 시간.
let latencyStart = null;
let latencyMeasured = true; // true = 잴 턴이 없음(초기 인사말 등)
let latencyLabelEl = null;

function markFirstResponse() {
  if (latencyMeasured || latencyStart === null) return;
  latencyMeasured = true;
  const elapsed = Math.round(performance.now() - latencyStart);
  if (latencyLabelEl) latencyLabelEl.textContent = `⏱ ${elapsed}ms`;
}

function base64ToInt16(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}

function bufferToBase64(buf) {
  let binary = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// index.html의 마이크 리샘플러와 동일한 선형보간 — 여기서는 TTS 결과물을
// (브라우저가 디코드해준 원래 sample rate에서) 24kHz로 맞추는 데 쓴다.
function resample(float32, inRate, outRate) {
  if (inRate === outRate) return float32;
  const ratio = inRate / outRate;
  const outLength = Math.round(float32.length / ratio);
  const out = new Float32Array(outLength);
  for (let i = 0; i < outLength; i++) {
    const srcIndex = i * ratio;
    const i0 = Math.floor(srcIndex), i1 = Math.min(i0 + 1, float32.length - 1);
    const frac = srcIndex - i0;
    out[i] = float32[i0] * (1 - frac) + float32[i1] * frac;
  }
  return out;
}

function floatTo16BitPCM(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

// TTS가 합성한 오디오(브라우저가 디코드한 AudioBuffer)를 24kHz mono PCM16 +
// 끝단 무음으로 바꾼다 — 그래야 서버가 실제 마이크 입력과 똑같이 취급한다.
function audioBufferToPCM16(audioBuffer, targetRate) {
  const mono = audioBuffer.getChannelData(0);
  const resampled = resample(mono, audioBuffer.sampleRate, targetRate);
  const combined = new Float32Array(resampled.length + Math.round(targetRate * TRAILING_SILENCE_SEC));
  combined.set(resampled, 0);
  return floatTo16BitPCM(combined);
}

const JITTER_BUFFER_SEC = 0.06; // 서버->브라우저 네트워크 흔들림 대비 완충 (40~100ms대 중간값)

function playDelta(base64Audio) {
  if (!outputCtx) {
    outputCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: OUTPUT_SAMPLE_RATE });
    nextPlayTime = 0;
  }
  const int16 = base64ToInt16(base64Audio);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 0x8000;

  const buffer = outputCtx.createBuffer(1, float32.length, OUTPUT_SAMPLE_RATE);
  buffer.copyToChannel(float32, 0);

  const source = outputCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(outputCtx.destination);

  // 이미 재생 예약이 밀려 있으면(같은 턴 안) 이어붙이고, 새 턴이 막 시작되는 참이면
  // (예약이 과거로 남아있으면) 지터 버퍼만큼 여유를 두고 시작한다 — 0에 가깝게 잡으면
  // 네트워크가 잠깐만 흔들려도 소리가 끊긴다(underrun).
  const startAt = nextPlayTime > outputCtx.currentTime
    ? nextPlayTime
    : outputCtx.currentTime + JITTER_BUFFER_SEC;
  source.start(startAt);
  nextPlayTime = startAt + buffer.duration;
}

function addMessage(who, text, { tools = [], error = false, latency = false } = {}) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + who + (error ? " err" : "");

  const label = document.createElement("div");
  label.className = "who";
  label.textContent = who === "elder" ? "나" : (error ? "오류" : "희망이");
  wrap.appendChild(label);

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(bubble);

  if (tools.length) {
    const toolsEl = document.createElement("div");
    toolsEl.className = "tools";
    for (const t of tools) {
      const chip = document.createElement("span");
      chip.textContent = "🔧 " + t;
      toolsEl.appendChild(chip);
    }
    wrap.appendChild(toolsEl);
  }

  if (latency) {
    const lat = document.createElement("div");
    lat.className = "latency";
    lat.textContent = "⏱ 측정 중…";
    wrap.appendChild(lat);
  }

  $("log").appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  return wrap;
}

// 텍스트 입력 + 전송 버튼으로 구성된 하단 바로 교체.
function showComposer() {
  $("composer").innerHTML = `
    <input id="text" type="text" placeholder="어르신 발화를 입력하세요…" autocomplete="off">
    <button id="send">전송</button>`;
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter") sendAsVoice(); });
  $("send").addEventListener("click", sendAsVoice);
  $("text").focus();
}

// "시작하기" 버튼 하나만 있는 초기 상태로 되돌림 — end_call 이후에도 이걸로 돌아온다.
function showStartButton() {
  $("composer").innerHTML = `<button id="start">시작하기</button>`;
  $("start").addEventListener("click", startSession);
  $("model").disabled = false;
}

function setComposerEnabled(enabled) {
  const text = $("text"), send = $("send");
  if (text) text.disabled = !enabled;
  if (send) send.disabled = !enabled;
}

function startSession() {
  $("start").disabled = true;
  $("model").disabled = true;
  status("연결 중…");

  const proto = location.protocol === "https:" ? "wss" : "ws";
  const model = $("model").value;
  const qs = model ? `?model=${encodeURIComponent(model)}` : "";
  ws = new WebSocket(`${proto}://${location.host}/ws/browser${qs}`);

  ws.onmessage = (evt) => handleServerMessage(JSON.parse(evt.data));
  ws.onerror = () => {
    addMessage("agent", "연결에 실패했습니다.", { error: true });
    showStartButton();
    status("연결에 실패했습니다. 다시 시도해주세요.");
  };
  ws.onclose = () => { ws = null; };
}

// 타이핑한 문장을 /tts로 합성 -> PCM16 24kHz로 디코드 -> 마이크 입력과 같은
// "audio" 메시지로 흘려보낸다. 지연시간은 오디오 전송을 시작하는 순간부터 잰다.
async function sendAsVoice() {
  const input = $("text");
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  const bubble = addMessage("elder", text, { latency: true });
  latencyLabelEl = bubble.querySelector(".latency");
  input.value = "";
  setComposerEnabled(false);
  status("음성으로 변환 중…");

  let pcm16;
  try {
    const res = await fetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(await res.text());
    const arrayBuf = await res.arrayBuffer();

    const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await decodeCtx.decodeAudioData(arrayBuf);
    decodeCtx.close();

    pcm16 = audioBufferToPCM16(audioBuffer, OUTPUT_SAMPLE_RATE);
  } catch (e) {
    latencyLabelEl.remove();
    addMessage("agent", "TTS 변환에 실패했습니다: " + e.message, { error: true });
    setComposerEnabled(true);
    status("입력하고 Enter 또는 전송을 누르세요.");
    return;
  }

  status("전송 중…");
  latencyMeasured = false;
  latencyStart = performance.now(); // 측정 시작: 오디오 전송 개시 시점

  const CHUNK_SAMPLES = 4096;
  for (let i = 0; i < pcm16.length; i += CHUNK_SAMPLES) {
    const slice = pcm16.subarray(i, i + CHUNK_SAMPLES);
    ws.send(JSON.stringify({ type: "audio", audio: bufferToBase64(slice.buffer) }));
  }

  status("응답 대기 중…");
}

let pendingTools = [];

function handleServerMessage(msg) {
  switch (msg.type) {
    case "ready":
      showComposer();
      status("입력하고 Enter 또는 전송을 누르세요.");
      break;
    case "audio":
      playDelta(msg.audio);
      markFirstResponse();
      break;
    case "transcript":
      if (msg.role === "agent") {
        markFirstResponse();
        if (!currentAgentBubble) currentAgentBubble = addMessage("agent", "");
        currentAgentBubble.querySelector(".bubble").textContent += msg.delta ?? "";
        $("log").scrollTop = $("log").scrollHeight;
      }
      // role === "elder"는 내가 보낸 오디오의 STT 결과 — 지연시간 측정과 무관하므로 무시.
      break;
    case "tool_used":
      pendingTools.push(msg.name);
      if (currentAgentBubble) {
        let toolsEl = currentAgentBubble.querySelector(".tools");
        if (!toolsEl) {
          toolsEl = document.createElement("div");
          toolsEl.className = "tools";
          currentAgentBubble.appendChild(toolsEl);
        }
        const chip = document.createElement("span");
        chip.textContent = "🔧 " + msg.name;
        toolsEl.appendChild(chip);
      }
      break;
    case "turn_done":
      currentAgentBubble = null;
      pendingTools = [];
      setComposerEnabled(true);
      $("text") && $("text").focus();
      status("입력하고 Enter 또는 전송을 누르세요.");
      break;
    case "call_ended":
      if (ws) ws.close();
      showStartButton();
      status("통화가 종료되었습니다. 다시 시작하려면 버튼을 누르세요.");
      break;
    case "error":
      addMessage("agent", msg.message, { error: true });
      setComposerEnabled(true);
      status("입력하고 Enter 또는 전송을 누르세요.");
      break;
  }
}

$("reset").addEventListener("click", () => {
  if (ws) { ws.send(JSON.stringify({ type: "hangup" })); ws.close(); ws = null; }
  $("log").innerHTML = "";
  currentAgentBubble = null;
  showStartButton();
  status("New call — memory cleared. 버튼을 눌러 다시 시작하세요.");
});

$("start").addEventListener("click", startSession);
$("start").disabled = false;
status("버튼을 눌러 통화를 시작하세요.");
</script>
</body>
</html>
